name: Testing the Python code

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10" ]

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pycodestyle
          if [ -f TPLab1Sadykov/rating/requirements.txt ]; then pip install -r TPLab1Sadykov/rating/requirements.txt; fi
          
      - name: Lint with pycodestyle
        working-directory: ./TPLab1Sadykov/rating
        run: |
          pycodestyle src test
          
      - name: Test with pytest
        working-directory: ./TPLab1Sadykov/rating
        run: |
          python -m pytest test
